      soc:1},
    s2:{icon:'chat',title:'Reply to messages and comments',every:1,sub:'',
      body:ol(['Open the inbox on each of the three.','Reply like a person. Ask where they&rsquo;re from.','No links in a first reply.']),soc:1},
    e1:{icon:'mail',title:'Send the weekly email',every:1,day:4,sub:'Thursday morning.',
      body:ol(['Open with one honest sentence, the way you&rsquo;d write to a friend.','This Sunday in three lines or fewer.','One ask only. Sign it with your own name.']),open:[['Open Mailchimp','https://login.mailchimp.com/']]},
    u1:{icon:'chat',title:'Text first-time guests',every:1,day:0,sub:'Sunday evening or Monday, from your own phone.',
      body:ol(['Mention one thing you talked about.','No links and no forms.'])+cp('Hey, it was really good to meet you on Sunday. Hope the rest of your weekend was good.')},
    l1:{icon:'link',title:'Check the Linktree links',every:4,sub:'',
      body:ol(['Tap every link and check it opens.','Remove links to events that have passed.','Plan your visit stays first. Give stays last.']),open:[['Open Linktree','https://linktr.ee/admin']]}
  };
  var KEY='lifebridge-volunteer', log=[], S={}, selP=null, selT={};
  try{var j=JSON.parse(localStorage.getItem(KEY)||'null'); if(j&&Array.isArray(j.log)) log=j.log.filter(function(x){return x&&T[x.t]&&typeof x.at==='number'})}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({log:log.slice(-300)}))}catch(e){}}
  // ---- dates, in Panama time (UTC-5 all year)
  var DAYMS=86400000, DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function dn(ts){return Math.floor((ts-5*3600000)/DAYMS)}
  function wd(n){return ((n+4)%7+7)%7}
  function md(n){var x=new Date(n*DAYMS);return MON[x.getUTCMonth()]+' '+x.getUTCDate()}
  function when(n){var t=dn(Date.now()),k=n-t;return k<=0?'Today':k===1?'Tomorrow':k<7?DOW[wd(n)]:md(n)}
  function every(id){var v=parseInt(S['vol.'+id+'.every'],10);return v>=1&&v<=52?v:T[id].every}
  function on(id){return S['vol.'+id+'.on']!=='off'}
  function last(id){for(var i=log.length-1;i>=0;i--) if(log[i].t===id) return log[i]; return null}
  function status(id){
    var t=T[id], L=last(id), today=dn(Date.now()), ws=today-wd(today), ev=every(id);
    if(ev===1){
      var day=t.day||0;
      if(L&&dn(L.at)>=ws) return {due:false,done:true,next:ws+7+day};
      if(t.day!=null&&wd(today)<t.day) return {due:false,next:ws+t.day};
      return {due:true,next:today};
    }
    if(!L) return {due:true,next:today};
    var nx=dn(L.at)+ev*7; return {due:today>=nx,done:today<nx,next:nx};
  }
  function freq(id){var e=every(id),t=T[id];return e===1?(t.day!=null?'Every '+DOW[t.day]:'Every week'):e===13?'Every 3 months':e===26?'Every 6 months':e===52?'Every year':'Every '+e+' weeks'}
  function tasks(p){return p.tasks.filter(on)}
  function logo(p,big){
    if(p.logos) return '<span class="vp-lg'+(big?' big':'')+'">'+p.logos.map(function(l){return '<img src="'+IMG+l[0]+'" alt="'+l[1]+'">'}).join('')+'</span>';
    return '<span class="vp-ic'+(big?' big':'')+'">'+IC[p.icon]+'</span>';
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function render(){
    var plats=P.filter(function(p){return tasks(p).length}), total=0;
    plats.forEach(function(p){p._due=tasks(p).filter(function(id){return status(id).due}); total+=p._due.length});
    if(!selP||!plats.some(function(p){return p.k===selP})){var f=plats.filter(function(p){return p._due.length})[0]||plats[0]; selP=f?f.k:null}
    d.getElementById('count').textContent=total?(total+(total===1?' thing':' things')+' due'):'All caught up';
    d.getElementById('tiles').innerHTML=plats.map(function(p){
      var ids=tasks(p), nd=p._due.length, st, cls='';
      if(nd){st=nd+(nd===1?' thing':' things')+' due';cls='due'}
      else{var nx=Math.min.apply(null,ids.map(function(id){return status(id).next})), any=ids.some(function(id){return status(id).done}); st=(any?'Done. ':'')+'Next '+when(nx).replace(/^T/,'t'); cls=any?'ok':''}
      return '<button type="button" role="tab" aria-selected="'+(p.k===selP)+'" class="vp-tile '+cls+(p.k===selP?' sel':'')+'" data-p="'+p.k+'">'+logo(p)+'<b>'+p.name+'</b><small>'+st+'</small></button>';
    }).join('');
    var p=plats.filter(function(x){return x.k===selP})[0], F=d.getElementById('focus'), SD=d.getElementById('side');
    if(!p){F.innerHTML='<div class="vp-focus rest"><h2>No tasks are switched on.</h2><p class="vp-sub">The pastor can switch tasks on in the admin page.</p></div>';SD.innerHTML='';return}
    var ids=tasks(p); if(ids.indexOf(selT[p.k])<0) selT[p.k]=p._due[0]||ids[0];
    var id=selT[p.k], t=T[id], st=status(id), L=last(id);
    SD.innerHTML='<h3>'+(ids.length>1?'In '+p.name:'The only task here')+'</h3>'+ids.map(function(x){
      var s=status(x); return '<button type="button" class="vp-row'+(s.due?' due':'')+(s.done?' done':'')+(x===id?' sel':'')+'" data-t="'+x+'" aria-pressed="'+(x===id)+'"><span class="vp-ic">'+IC[s.done?'check':T[x].icon]+'</span><div><b>'+T[x].title+'</b><small>'+freq(x)+'</small></div><em'+(s.done?' class="ok"':'')+'>'+(s.due?'Due':when(s.next))+'</em></button>';
    }).join('');
    var h=logo(p,true)+'<h2>'+t.title+'</h2><p class="vp-sub">'+freq(id)+'.'+(t.sub?' '+t.sub:'')+'</p>';
    if(st.done&&L) h+='<p class="vp-state">'+IC.check+'<span>Done '+md(dn(L.at))+'. Due again '+when(st.next).replace(/^T/,'t')+'.</span>'+(Date.now()-L.at<DAYMS?'<button type="button" data-undo>Undo</button>':'')+'</p>';
    h+='<div class="vp-fbody">'+t.body+'</div>';
    if(t.soc) h+='<div class="vp-gos">'+SOC.map(function(s){return '<a class="vp-go" href="'+s[1]+'" target="_blank" rel="noopener noreferrer"><img src="'+IMG+s[2]+'" alt="">Open '+s[0]+'</a>'}).join('')+'</div>';
    (t.open||[]).forEach(function(o){h+='<a class="vp-go" href="'+o[1]+'" target="_blank" rel="noopener noreferrer">'+o[0]+'</a>'});
    h+='<button class="vp-done'+(st.done?' again':'')+'" type="button" data-done>'+IC.check+'<span>'+(st.done?'Mark as done again':'Mark as done')+'</span></button>';
    h+='<p class="vp-last">'+(L?'Last done '+md(dn(L.at))+(L.note?', featuring '+esc(L.note).toLowerCase():'')+'.':'Not done yet on this device.')+'</p>';
    F.innerHTML='<div class="vp-focus">'+h+'</div>';
    var rv=F.querySelector('[data-review]');
    if(rv){var u=String(S['vol.reviewlink']||'').trim(), ok=/^https?:\/\/\S+$/.test(u); rv.innerHTML=cp('Here&rsquo;s the link to leave LifeBridge a Google review. It takes two minutes. Thank you!'+(ok?' '+esc(u):''))+(ok?'':'<p>The review link isn&rsquo;t set yet. The pastor can add it in the admin page, under Volunteer panel.</p>')}
    var ft=F.querySelector('[data-feat]');
    if(ft){var seen=[]; for(var i=log.length-1;i>=0&&seen.length<3;i--) if(log[i].t==='s1'&&log[i].note&&seen.indexOf(log[i].note)<0) seen.push(log[i].note);
      ft.innerHTML=seen.length?'Featured lately: '+seen.map(function(x){return '<span class="vp-tag">'+esc(x)+'</span>'}).join('')+' Pick a group that isn&rsquo;t here.':'Over time, feature all four groups equally: people new to the city, professionals, families and retirees.'}
  }
  d.addEventListener('click',function(e){
    var x;
    if((x=e.target.closest('[data-p]'))){selP=x.getAttribute('data-p');render();return}
    if((x=e.target.closest('[data-t]'))){selT[selP]=x.getAttribute('data-t');render();return}
    if((x=e.target.closest('[data-types] button'))){var all=[].slice.call(x.parentNode.children),i=all.indexOf(x);all.forEach(function(b){b.classList.toggle('on',b===x);b.setAttribute('aria-pressed',b===x)});[].forEach.call(x.closest('.vp-step').querySelectorAll('.vp-type'),function(pn,k){pn.hidden=k!==i});return}
    if((x=e.target.closest('[data-group] button'))){[].forEach.call(x.parentNode.children,function(b){var o=b===x&&!x.classList.contains('on');b.classList.toggle('on',o);b.setAttribute('aria-pressed',o)});return}
    if((x=e.target.closest('[data-copy]'))){var tx=x.parentNode.querySelector('p').textContent, sp=x.querySelector('span'), okk=function(){sp.textContent='Copied';setTimeout(function(){sp.textContent='Copy'},1800)};
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(tx).then(okk,function(){});
      else{var ta=d.createElement('textarea');ta.value=tx;d.body.appendChild(ta);ta.select();try{d.execCommand('copy');okk()}catch(er){}ta.remove()}
      return}
    if((x=e.target.closest('[data-done]'))){var id=selT[selP], g=d.querySelector('[data-group] button.on'); log.push({t:id,at:Date.now(),note:g?g.textContent:''}); save(); render(); return}
    if((x=e.target.closest('[data-undo]'))){var id2=selT[selP]; for(var k=log.length-1;k>=0;k--) if(log[k].t===id2){log.splice(k,1);break} save(); render(); return}
  });
  render();
  if(window.fetch&&location.protocol!=='file:') fetch('../settings.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.site&&typeof j.site==='object'){S=j.site;render()}}).catch(function(){});
  setInterval(render,10*60000);
})();
</script>
